<!doctype html>
<html lang="zh-CN">
<head>

<title>第三步 · 3D 组网 · Demo v2</title>
<style>
@font-face{font-family:"NR";src:url(fonts/newsreader-400.woff2) format("woff2");font-weight:400}
@font-face{font-family:"NSerif";src:url(fonts/noto-serif-sc-400.woff2) format("woff2");font-weight:400}

:root{--ink:#ECEAE4;--mut:rgba(236,234,228,.58);--faint:rgba(236,234,228,.28);--line:rgba(255,255,255,.12);--blue:#4D7BFF;--gold:#E2B55A;--red:#FF6B5E}

#app{position:absolute;left:0;top:0;width:1440px;height:900px;background:#05060A;transform-origin:0 0;overflow:hidden}
canvas{position:absolute;inset:0}

.p{pointer-events:auto}

.hd{position:absolute;left:36px;top:28px}

.tr{position:absolute;right:36px;top:24px}

.ph.on{opacity:1}.ph.done{opacity:.6}
.ph i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--mut);margin-top:6px;flex:none}

.nd span{flex:1}.nd small{font:500 10px JBM;letter-spacing:.1em;color:var(--gold)}
.nd.gap{border-color:rgba(255,107,94,.45);color:var(--ink)}.nd.gap i{background:var(--red)}.nd.gap small{color:var(--red)}

#ask{position:absolute;left:50%;bottom:120px;width:540px;margin-left:-270px;background:rgba(10,12,22,.94);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:16px 20px;text-align:center;opacity:0;pointer-events:none;transition:opacity .4s}

#sheet .l{margin:14px 40px 0;height:10px;background:#E9E6DE;border-radius:2px}
.demo{position:absolute;right:32px;bottom:22px;font:400 11px NSans;color:var(--faint);pointer-events:auto}
.demo button{background:none;border:1px solid var(--line);color:var(--mut);font:500 11px JBM;padding:3px 8px;border-radius:5px;margin-left:6px}

<body>
<div id="app">
  <canvas id="cv" width="1440" height="900"></canvas>
  <div id="ui">
    <div class="hd"><b>正在为你组网</b><small>REQ · 0712-0001 · 发起人 陈思远</small></div>
    <div class="clock">已用时 <b id="clk">00:00</b></div>
    <div class="tr p"><button>收起，好了通知我</button></div>
    <div class="left"><div class="lt">进度</div><div id="phs"></div>
      <div class="num"><div><small>检索范围</small><b id="nA">—</b></div><div><small>候选智能体</small><b id="nC">—</b></div><div><small>入网</small><b id="nN">—</b></div></div></div>
    <div class="needs"><div class="t"><span>需求覆盖</span><b id="cov">0<em> / 11</em></b></div><div id="nds"></div></div>
    <div class="log" id="log"></div>
    <div id="ask"><h4>你更看重哪一点？</h4><p>选一个，网络会按它调整 · 6 秒不选按「上线快」</p><div class="o"><button data-v="fast">上线快</button><button data-v="cheap">成本低</button><button data-v="local">本地部署</button></div><div class="bar"><i id="askBar"></i></div></div>
    <div id="pop"><button class="x">×</button><small id="pk"></small><h5 id="pn"></h5><p id="pd"></p><span class="st" id="ps"></span></div>
    <div id="done"><div class="s"><b>组网方案已生成</b><small>签发给 陈思远 · SI · 0712 · 0004</small></div></div>
    <button id="cta" class="p" onclick="if(this.style.pointerEvents==='none')return;window.UX?UX.goScheme():(location.href='step4-组网方案.html')">查看完整组网方案 →</button>
    <div class="demo">Demo v2 · 示例节奏 40 秒<button id="x2">×2 速</button><button id="rp">↻ 重播</button></div>
  </div>
  <div id="sheet"><h3>需求文档</h3><div class="l"></div><div class="l" style="width:70%"></div><div class="l"></div><div class="l" style="width:50%"></div></div>
</div>
<script>
const W = 1440, H = 900, CX = 720, CY = 470, END = 40, $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const cv = $('#cv'), ctx = cv.getContext('2d');
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, u) => a + (b - a) * u, seg = (t, a, b) => clamp((t - a) / (b - a));
const eo = u => u >= 1 ? 1 : 1 - Math.pow(2, -10 * u), eio = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function glow(x, y, r, c, a) { if (a <= 0 || r <= 0) return; const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(${c},${a})`); g.addColorStop(1, `rgba(${c},0)`); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, 2 * r, 2 * r); }

// ── 需求（来自第二步：你点出的 3 条 + 我们发现的 8 条）──
const NEEDS = [['值班人员脱岗', 0], ['通道被杂物占用', 0], ['烟感误报多', 0], ['夜间升级', 1], ['对接报警主机', 1], ['误报二次确认', 1], ['数据不出园区', 1], ['检修防护', 1], ['巡查月报', 1], ['周界安防', 1], ['预测性维护', 1]];
NEEDS.forEach((n, i) => n.ang = i / NEEDS.length * Math.PI * 2 + .3);
// ── 3D 旋涡星系：3000 个智能体 ──
const R = rng(2048), N = 3000, ST = [];
for (let i = 0; i < N; i++) { const arm = i % 3, r = 60 + Math.pow(R(), .62) * 560, a = arm * 2.094 + r * .0105 + (R() - .5) * .55, th = (R() + R() + R() - 1.5) * 26 * (1 - r / 700);
  ST.push({ x: Math.cos(a) * r, y: th, z: Math.sin(a) * r, a: Math.atan2(Math.sin(a), Math.cos(a)), r, s: .4 + .6 * R(), ph: R() * 6.28 }); }
const near = (ang, i) => { const d = Math.abs(((ST[i].a - ang + Math.PI * 3) % (Math.PI * 2)) - Math.PI); return d < .17 && ST[i].r > 150; };
const LIT = ST.map((_, i) => NEEDS.findIndex(n => near(n.ang, i)));
// ── 组网节点：智能体名取自现有系统对这条需求的真实匹配 ──
const NODES = [
  { id: 'n1', name: '发生了什么', role: '视频事件识别', p: [-330, -70, -90], cov: [0, 1], ring: 0 },
  { id: 'n2', name: 'FireMind 智慧消防', role: '火灾预测预警 · 误报研判', p: [-40, -150, 50], cov: [2, 5, 10], ring: 1 },
  { id: 'n3', name: 'AI安全卫士', role: '风险闭环处置 · 告警升级', p: [-30, 140, -60], cov: [3, 7], ring: 2 },
  { id: 'n4', name: '消防Agent', role: '巡查记录 · 报备', p: [290, 10, 20], cov: [8], ring: 3 },
  { id: 'n6', name: 'WGAI', role: '本地视觉分析', p: [-390, 205, 70], cov: [6], ring: 4 },
  { id: 'n5', name: 'Thinglinks-IoT', role: '报警主机 · 设备数据接入', p: [-250, -230, 160], cov: [4], ring: 5, late: 1 },
];
const EDGES = [['n1', 'n2', 27.4], ['n1', 'n3', 27.9], ['n6', 'n1', 28.4], ['n2', 'n3', 28.9], ['n3', 'n4', 29.4], ['n2', 'n4', 29.9], ['n5', 'n2', 32.2]];
const CONF = [29.6, 31.6];
const RING = Array.from({ length: 18 }, (_, k) => { const pool = ST.map((_, i) => i).filter(i => LIT[i] >= 0); return { src: pool[Math.floor(rng(k + 5)() * pool.length)], ang: k / 18 * Math.PI * 2, out: k >= 6 && k % 2 === 0 ? (k % 4 ? '能力不符' : '测评未达标') : null, real: k < 6 ? k : -1, id: '#' + (1100 + k * 37) }; });
const PH = [['需求入场', 0], ['检索星系', 2.5], ['按需召回', 8], ['验证报到', 15.5], ['组网推演', 26], ['生成方案', 35.5]];
const LOGS = [[.4, '已签发需求 REQ · 0712-0001 · 11 项'], [3, '检索 3,000+ 智能体 · 40,000+ Skill'], [8.4, '按 11 项需求分头召回'], [13.5, '召回候选 126 个'], [16.5, '核验身份与测评等级'], [19.4, '保留 10 个 · 8 个能力不符或测评未达标'], [21, '等待你的偏好…'], [27, '开始组网：智能体逐个入网'], [29.7, '冲突：报警主机数据无法直接接入'], [31.7, '加入 Thinglinks-IoT 接管设备数据'], [35.6, '需求覆盖 10/11 · 周界安防建议二期'], [37.6, '组网方案已生成']];
let t = 0, last = 0, speed = 1, pref = null;
const ui = $('#ui'), mk = (cls, html) => { const e = document.createElement('div'); e.className = 'lab ' + cls; e.innerHTML = html; ui.appendChild(e); return e; };
const put = (e, x, y, a, sc = 1, ax = -50, ay = -50) => { e.style.opacity = clamp(a); e.style.visibility = a > .01 ? 'visible' : 'hidden'; e.style.transform = `translate(${x}px,${y}px) translate(${ax}%,${ay}%) scale(${sc})`; };
$('#phs').innerHTML = PH.map(([n]) => `<div class="ph"><i></i><b>${n}</b></div>`).join('');
$('#nds').innerHTML = NEEDS.map(([n, g]) => `<div class="nd ${g ? 'g' : ''}"><i></i><span>${n}</span><small></small></div>`).join('');
const beamEls = NEEDS.map(([n, g]) => mk('beam' + (g ? ' g' : ''), n));
const whyEls = RING.map(r => mk('why', r.out || ''));
const nodeEls = {}; NODES.forEach(n => { const e = mk('node', ''); e.dataset.id = n.id; nodeEls[n.id] = e; });
const conflict = mk('conflict', '冲突 · 报警主机数据接不进来');
function fillNode(n) { const tag = pref === 'local' && (n.id === 'n6' || n.id === 'n1') ? '支持本地部署' : pref === 'cheap' && n.id === 'n4' ? '按量计费' : pref === 'fast' && n.id === 'n2' ? '现成可用' : '';
  nodeEls[n.id].innerHTML = `<small>${n.late ? '新增节点' : '入网 · ' + n.id.toUpperCase()}</small><b>${n.name}</b><span>${n.role}</span><div class="cv">${n.cov.map(c => `<em>${NEEDS[c][0]}</em>`).join('')}</div>${tag ? `<span class="tg">${tag}</span>` : ''}`; }
NODES.forEach(fillNode);
$$('#ask button').forEach(b => b.onclick = () => choose(b.dataset.v));
function choose(v, auto) { if (pref) return; pref = v; $$('#ask button').forEach(b => b.classList.toggle('sel', b.dataset.v === v)); const label = { fast: '上线快', cheap: '成本低', local: '本地部署' }[v]; LOGS.push([t + .1, `偏好：${label}${auto ? '（默认）' : ''}`]); LOGS.sort((a, b) => a[0] - b[0]); NODES.forEach(fillNode); try { const r = JSON.parse(sessionStorage.getItem('si_run')||'{}'); r.preference=v; r.preferenceLabel=label; sessionStorage.setItem('si_run', JSON.stringify(r)); } catch(e){} }

// ── 镜头：绕星系缓慢旋转，最后转正、压平 ──
function cam() {
  // 检索阶段一直绕星系转；组网开始时大摆臂转回正面，之后只轻轻摇摆；收拢时完全转正
  const raw = t * .09 + .4, sway = .32 * Math.sin((t - 24) * .45), net = eio(seg(t, 24, 27.5)), fl = eio(seg(t, 34.5, 37.5));
  const yaw = lerp(lerp(raw, sway, net), 0, fl);
  return { yaw, pitch: lerp(lerp(.42, .32, seg(t, 8, 16)), 0, fl), dist: lerp(1500, 1050, eio(seg(t, 2, 9))) - eio(seg(t, 24, 28)) * 120 };
}
let C = cam();
function proj(x, y, z) { const cy = Math.cos(C.yaw), sy = Math.sin(C.yaw), x1 = x * cy - z * sy, z1 = x * sy + z * cy, cp = Math.cos(C.pitch), sp = Math.sin(C.pitch), y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp, f = 900 / (z2 + C.dist); return [CX + x1 * f * 1.08, CY + y2 * f * 1.08, f, z2]; }
function ringW(r, tt) { const k = eo(seg(tt, 15.5, 18.5)), s = ST[r.src], a = r.ang + tt * .05; return [lerp(s.x, Math.cos(a) * 250, k), lerp(s.y, 0, k), lerp(s.z, Math.sin(a) * 250, k)]; }
function nodeW(n) { const r = RING[n.ring], from = ringW(r, Math.min(t, 26)), k = eo(seg(t, n.late ? 31.6 : 26.2, n.late ? 32.8 : 27.6)), fl = eio(seg(t, 34.5, 37.5));
  return [lerp(from[0], n.p[0], k), lerp(from[1], n.p[1], k), lerp(from[2], n.p[2] * (1 - fl), k)]; }

function render() {
  C = cam(); ctx.fillStyle = '#05060A'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'lighter';
  const galA = seg(t, 2.2, 4.5) * (1 - .62 * seg(t, 24, 28)) * (1 - .5 * seg(t, 34.5, 37));
  const wave = t > 3 && t < 7 ? eo(seg(t, 3, 6.5)) * 700 : -1;
  for (let i = 0; i < N; i++) {
    const s = ST[i], [x, y, f, z] = proj(s.x, s.y, s.z); if (z < -C.dist + 50) continue;
    let a = galA * (.25 + .45 * s.s) * (.65 + .35 * Math.sin(t * 1.3 + s.ph)) * clamp(f * 1.1), col = '210,222,255';
    if (wave > 0) a += Math.exp(-Math.abs(s.r - wave) / 26) * .8 * galA;
    const b = LIT[i]; if (b >= 0) { const on = seg(t, 8.6 + b * .6, 9.3 + b * .6) * (1 - seg(t, 22, 26)); if (on > .05) { a += on * .7; col = NEEDS[b][1] ? '226,181,90' : '110,150,255'; } }
